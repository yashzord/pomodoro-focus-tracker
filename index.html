<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Focus & Task Tracker</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --text-color: #e0e0e0;
            --primary-color: #e94560;
            --secondary-color: #0f3460;
            --accent-color: #533483;
            --border-color: #4a4a6a;
            --shadow-color: rgba(0, 0, 0, 0.3);
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--secondary-color);
            border-radius: 12px;
            box-shadow: 0 8px 16px var(--shadow-color);
            padding: 30px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 25px;
            font-size: 2.2em;
        }

        .timer-section {
            margin-bottom: 30px;
        }

        .mode-selector button {
            background-color: var(--accent-color);
            color: var(--text-color);
            border: none;
            padding: 10px 18px;
            margin: 0 5px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .mode-selector button:hover {
            background-color: #6a4a9d;
            transform: translateY(-2px);
        }

        .mode-selector button.active {
            background-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }

        #timer-display {
            font-size: 5em;
            font-weight: bold;
            margin: 25px 0;
            color: var(--primary-color);
            letter-spacing: 2px;
        }

        .timer-controls button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            margin: 0 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .timer-controls button:hover:not(:disabled) {
            background-color: #ff6b81;
            transform: translateY(-2px);
        }

        .timer-controls button:disabled {
            background-color: #666;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .task-section {
            margin-top: 30px;
            text-align: left;
        }

        .task-input-group {
            display: flex;
            margin-bottom: 20px;
        }

        #task-input {
            flex-grow: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 1em;
            margin-right: 10px;
        }

        #task-input::placeholder {
            color: #888;
        }

        #add-task-button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.2s ease;
        }

        #add-task-button:hover {
            background-color: #ff6b81;
        }

        #task-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .task-item {
            display: flex;
            align-items: center;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 10px;
            transition: background-color 0.2s ease;
        }

        .task-item.completed {
            background-color: #2a2a4a;
            opacity: 0.7;
        }

        .task-item input[type="checkbox"] {
            margin-right: 15px;
            width: 20px;
            height: 20px;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        .task-item span {
            flex-grow: 1;
            font-size: 1.1em;
            color: var(--text-color);
        }

        .task-item.completed span {
            text-decoration: line-through;
            color: #999;
        }

        .task-item .delete-task {
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 1.2em;
            cursor: pointer;
            margin-left: 10px;
            transition: color 0.2s ease;
        }

        .task-item .delete-task:hover {
            color: #ff6b81;
        }

        .no-tasks {
            color: #999;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }

        .stats-section {
            margin-top: 20px;
            padding: 15px;
            background-color: var(--accent-color);
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 500;
            color: var(--text-color);
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            #timer-display {
                font-size: 4em;
            }

            .mode-selector button,
            .timer-controls button {
                padding: 10px 15px;
                font-size: 0.9em;
                margin: 5px;
            }

            .timer-controls {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
            }

            .task-input-group {
                flex-direction: column;
            }

            #task-input {
                margin-right: 0;
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Pomodoro Focus & Task Tracker</h1>
        </header>

        <section class="timer-section">
            <div class="mode-selector">
                <button id="pomodoro-mode" class="active">Pomodoro</button>
                <button id="short-break-mode">Short Break</button>
                <button id="long-break-mode">Long Break</button>
            </div>
            <div id="timer-display">25:00</div>
            <div class="timer-controls">
                <button id="start-button">Start</button>
                <button id="pause-button">Pause</button>
                <button id="stop-button">Stop</button>
            </div>
        </section>

        <section class="task-section">
            <h2>Tasks</h2>
            <div class="task-input-group">
                <input type="text" id="task-input" placeholder="Add a new task...">
                <button id="add-task-button">Add Task</button>
            </div>
            <ul id="task-list">
                <!-- Tasks will be rendered here by JavaScript -->
            </ul>
        </section>

        <section class="stats-section">
            <h2>Daily Focus Stats</h2>
            <div id="stats-display">Today: 0 Pomodoros, 0 min focus</div>
        </section>
    </div>

    <script type="module" src="./src/main.ts"></script>
</body>
</html>
